name: Linux fast tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pinned Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock-linux.txt

      - name: Install pinned environment
        run: python -m pip install --disable-pip-version-check -r requirements-lock-linux.txt

      - name: Run full source suite
        run: python -m pytest am3d/ -q

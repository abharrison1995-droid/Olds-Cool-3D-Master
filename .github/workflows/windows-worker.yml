name: Windows local-generation worker

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-boundary:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install GPU-independent worker test dependencies
        run: python -m pip install --disable-pip-version-check attrs==26.1.0 jsonschema==4.26.0 jsonschema-specifications==2025.9.1 msgpack==1.2.1 numpy==2.4.6 Pillow==12.3.0 referencing==0.37.0 rpds-py==2026.6.3 pytest==9.1.1

      - name: Exercise Windows worker and fake Codex CLI lifecycle
        run: python -m pytest am3d/ai/test_worker_process.py am3d/ai/test_codex_cli_provider.py -q

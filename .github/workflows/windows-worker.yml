name: Windows local-generation worker

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-boundary:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install GPU-independent worker test dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.4.6 msgpack==1.2.1 Pillow==12.3.0 pytest==9.1.1

      - name: Exercise Windows worker lifecycle and local pipeline
        run: python -m pytest am3d/ai/test_worker_process.py -q

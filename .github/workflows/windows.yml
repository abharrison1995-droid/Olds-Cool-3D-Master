name: Windows candidate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-accept:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PY_PYTHON3: "3.12"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python for independent export verification
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the frozen Windows candidate
        shell: pwsh
        run: |
          $hostPython = Join-Path $env:pythonLocation "python.exe"
          $buildArgs = @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", ".\build_windows.ps1", "-HostPython", $hostPython)
          if (-not (Test-Path .\requirements-lock-windows.txt)) {
            $buildArgs += "-CaptureLock"
          }
          & pwsh @buildArgs *>&1 | Tee-Object -FilePath .\windows_build.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) { exit $buildExitCode }
          if (-not (Test-Path .\requirements-lock-windows.txt)) {
            $proposal = ".\build\windows\proposed-requirements-lock-windows.txt"
            if (-not (Test-Path -LiteralPath $proposal -PathType Leaf)) {
              throw "Successful bootstrap build did not produce its final lock proposal."
            }
            Copy-Item -LiteralPath $proposal -Destination .\requirements-lock-windows.txt
            & pwsh -NoProfile -ExecutionPolicy Bypass -File .\build_windows.ps1 -HostPython $hostPython *>&1 | Tee-Object -FilePath .\windows_locked_build.log
            $lockedBuildExitCode = $LASTEXITCODE
            if ($lockedBuildExitCode -ne 0) { exit $lockedBuildExitCode }
          }

      - name: Run frozen Windows acceptance
        shell: pwsh
        run: |
          & pwsh -NoProfile -ExecutionPolicy Bypass -File .\docs\evidence\desktop-release\phase-f\frozen_acceptance.ps1 -Bundle "release\3D MASTER 2005 Beta" -SkipInteractive *>&1 | Tee-Object -FilePath .\frozen_acceptance.log
          $acceptanceExitCode = $LASTEXITCODE
          if ($acceptanceExitCode -ne 0) { exit $acceptanceExitCode }

      - name: Verify exports with the independent reader
        shell: pwsh
        run: |
          & pwsh -NoProfile -ExecutionPolicy Bypass -File .\docs\evidence\desktop-release\phase-f\export_check.ps1 -Bundle "release\3D MASTER 2005 Beta" *>&1 | Tee-Object -FilePath .\export_check.log
          $exportExitCode = $LASTEXITCODE
          if ($exportExitCode -ne 0) { exit $exportExitCode }

      - name: Upload candidate, provenance, and captured dependency lock
        uses: actions/upload-artifact@v7
        with:
          name: windows-candidate-${{ github.run_id }}
          if-no-files-found: error
          path: |
            release/3D MASTER 2005 Beta/
            release/3D-MASTER-2005-Beta-*-win64.zip
            release/3D-MASTER-2005-Beta-*-win64.zip.sha256
            release/BUILD_PROVENANCE-windows.txt
            release/BUILD_INPUTS-windows.json
            requirements-lock-windows.txt
            windows_build.log
            windows_locked_build.log
            frozen_acceptance.log
            export_check.log

      - name: Upload failure logs and any captured lock
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            requirements-lock-windows.txt
            build/windows/proposed-requirements-lock-windows.txt
            windows_build.log
            windows_locked_build.log
            frozen_acceptance.log
            export_check.log

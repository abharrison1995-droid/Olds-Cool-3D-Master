[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "am3d"
version = "0.1.0"
description = "3D MASTER:2005 - A pure spline-based 3D character animation suite (Animation Master revival)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "3D MASTER:2005 Team"}]
dependencies = [
    "numpy>=1.24",
    "msgpack>=1.0",
    "PySide6>=6.5",
    "Pillow>=10.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "hypothesis>=6.0"]
renderer = ["moderngl>=5.11"]
accel = ["numba>=0.58"]

[project.scripts]
am3d = "am3d.ui.app:main"
am3d-recipe = "am3d.recipes.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["am3d*"]

[tool.pytest.ini_options]
testpaths = ["am3d"]
python_files = ["test_*.py", "*_test.py"]